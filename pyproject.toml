[project]
name = "preflight"
version = "0.1.0"
description = "Catch AI agent regressions in CI, using SigNoz as the source of truth."
requires-python = ">=3.12"
dependencies = [
    "opentelemetry-api>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.scripts]
preflight = "preflight.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["preflight", "agent"]
