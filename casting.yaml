apiVersion: v1alpha1
kind: Installation
metadata:
  name: signoz
spec:
  deployment:
    flavor: compose
    mode: docker
  # Pinned to the releases Preflight was built against. Left at :latest, a
  # fresh stack pulls SigNoz releases whose RBAC answers the bootstrap
  # service-account key with 403 on traces:read, so the gate reads nothing.
  ingester:
    spec:
      image: signoz/signoz-otel-collector:v0.144.6
  mcp:
    spec:
      enabled: true
      image: signoz/signoz-mcp-server:v0.9.0
  signoz:
    spec:
      image: signoz/signoz:v0.134.0
      env:
        # Our committed dashboards in dashboards/ use the v6 dashboard schema
        # (spec.panels + spec.layouts with $ref). Only the DashboardPageV2 UI
        # renders that schema, and it sits behind this flag -- with the flag off
        # the legacy page looks for data.widgets, finds nothing, and shows the
        # "Welcome to your new dashboard" empty state even though the API has
        # every panel. Underscores inside a flag name are doubled in the env var
        # form (see SIGNOZ_FLAGGER_CONFIG_BOOLEAN_USE__SPAN__METRICS upstream).
        SIGNOZ_FLAGGER_CONFIG_BOOLEAN_USE__DASHBOARD__V2: "true"
